<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#070B16"/>
  
  <!-- Atmosphere Background Glows -->
  <circle cx="200" cy="150" r="300" fill="#2F6BFF" fill-opacity="0.15" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="350" fill="#7C5CFF" fill-opacity="0.15" filter="blur(100px)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#22304A" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#22304A" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Main Card Container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0E1424" stroke="#22304A" stroke-width="2"/>
  
  <!-- Brand Logo -->
  <g transform="translate(140, 140)">
    <!-- Speech Bubble with 3-line split tail -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H48C54.6274 0 60 5.37258 60 12V36C60 42.6274 54.6274 48 48 48H20L6 58V48H12C5.37258 48 0 42.6274 0 36V12Z" fill="#2F6BFF"/>
    <!-- Three line tail split inside icon -->
    <path d="M16 18H44" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M16 26H36" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M16 34H28" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  
  <text x="220" y="175" fill="#E8EEFA" font-family="system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="-1">UniChat</text>
  <text x="375" y="175" fill="#8C9AB5" font-family="system-ui, sans-serif" font-weight="500" font-size="22">|</text>
  <text x="400" y="175" fill="#9B84FF" font-family="system-ui, sans-serif" font-weight="600" font-size="22">Chat. Connect. Ask.</text>
  
  <!-- Main Tagline Headline -->
  <text x="140" y="270" fill="#E8EEFA" font-family="system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-2">Unified team chat connected to</text>
  <text x="140" y="340" fill="#5B8CFF" font-family="system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-2">Slack &amp; Discord with Gemini AI.</text>

  <text x="140" y="415" fill="#8C9AB5" font-family="system-ui, sans-serif" font-weight="400" font-size="24">One hub for your channels. Cited AI answers. Zero message fragmentation.</text>

  <!-- Platform Pills -->
  <g transform="translate(140, 460)">
    <!-- UniChat Native -->
    <rect x="0" y="0" width="130" height="38" rx="10" fill="#2F6BFF" fill-opacity="0.2" stroke="#5B8CFF" stroke-opacity="0.4"/>
    <text x="65" y="24" fill="#5B8CFF" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">UniChat Native</text>

    <!-- Slack -->
    <rect x="145" y="0" width="100" height="38" rx="10" fill="#4A154B"/>
    <text x="195" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Slack Sync</text>

    <!-- Discord -->
    <rect x="260" y="0" width="115" height="38" rx="10" fill="#5865F2"/>
    <text x="317" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Discord Sync</text>

    <!-- Gemini AI -->
    <rect x="390" y="0" width="125" height="38" rx="10" fill="#7C5CFF" fill-opacity="0.2" stroke="#9B84FF" stroke-opacity="0.4"/>
    <text x="452" y="24" fill="#9B84FF" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Gemini AI Q&amp;A</text>
  </g>
</svg>
